  <!-- Typography Group: HOMEMART4U -->
  <g transform="translate(122, 54)">
    <!-- Shadow for depth -->
    <text x="0" y="1" font-family="'Arial Black', 'Impact', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#7F1D1D" opacity="0.3">HOMEMART4U</text>
    <!-- Main Red Wordmark -->
    <text x="0" y="0" font-family="'Arial Black', 'Impact', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#991B1B">HOME</tspan>
      <tspan fill="#C51111">MART</tspan>
      <tspan fill="#E11D48">4U</tspan>
    </text>
    <!-- Golden Underline Swoosh -->
    <path d="M 4 8 C 50 14, 150 14, 214 7 C 160 11, 60 11, 4 8 Z" fill="#F59E0B" />
    <!-- Tagline -->
    <text x="6" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.2" fill="#78716C">DAILY GROCERIES &amp; FRESH MEAT</text>
