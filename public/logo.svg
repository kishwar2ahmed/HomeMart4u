    <path d="M 56 34 C 54 26, 60 18, 67 15 C 68 22, 73 24, 76 21 C 80 18, 85 20, 86 26 C 82 32, 74 36, 64 36 C 60 36, 58 35, 56 34 Z" fill="#EF4444" />

