    <path d="M 117 65 V 82 M 126 65 V 82 M 108 73 H 134" stroke="#C51111" stroke-width="2" />
    <path d="M 136 65 L 140 59" stroke="#C51111" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="115" cy="87" r="2.8" fill="#C51111" />
