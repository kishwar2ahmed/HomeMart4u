    <path d="M 74 60 C 78 60, 82 65, 81 72 C 80 77, 74 78, 71 73 Z" fill="#EF4444" />

    <!-- Eye -->
    <circle cx="72" cy="45" r="3.2" fill="#FFFFFF" />
    <circle cx="72" cy="45" r="2" fill="#1C1917" />
    <circle cx="71.2" cy="44.2" r="0.7" fill="#FFFFFF" />
