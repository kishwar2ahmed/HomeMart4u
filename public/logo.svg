    <!-- White Feathers & Neck -->
    <path d="M 60 40 C 60 40, 72 44, 78 52 C 84 60, 84 72, 88 84 C 84 88, 76 96, 68 100 C 72 90, 72 82, 68 76 C 64 84, 58 92, 50 96 C 54 88, 56 80, 54 72 C 48 80, 42 86, 36 90 C 40 76, 46 62, 58 48 Z" fill="#FFFFFF" />
    <path d="M 64 56 C 68 68, 72 80, 74 92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 56 64 C 58 74, 60 84, 58 92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 46 72 C 48 80, 48 86, 44 92" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" />

